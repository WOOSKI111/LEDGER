{% extends "base.html" %}
{% block title %}Review · Ledger{% endblock %}
{% block content %}

<h2 style="margin-bottom:16px;">Review Before Saving</h2>

<div class="item-card">
  <div class="field">
    <label>Supplier</label>
    <input type="text" id="hdr_supplier" value="{{ header.get('supplier','') }}" placeholder="e.g. AutoZone Commercial">
  </div>
  <div class="field-row">
    <div class="field">
      <label>Invoice #</label>
      <input type="text" id="hdr_invoice_number" value="{{ header.get('invoice_number','') }}">
    </div>
    <div class="field">
      <label>Invoice Date</label>
      <input type="date" id="hdr_invoice_date" value="{{ header.get('invoice_date','') }}">
    </div>
  </div>
  <div class="field">
    <label>Due Date (optional)</label>
    <input type="date" id="hdr_due_date" value="{{ header.get('due_date','') }}">
  </div>
</div>

<div class="section-head"><h2>Parts on This Invoice</h2></div>
<div id="itemsContainer"></div>
<button class="btn btn-outline btn-block" id="addItemBtn" type="button">+ Add Another Part</button>

<div style="margin-top:24px; display:flex; gap:10px;">
  <a href="{{ url_for('index') }}" class="btn btn-outline">Cancel</a>
  <button class="btn btn-primary btn-block" id="saveBtn">Save Invoice</button>
</div>

<div class="toast" id="toast"></div>

{% endblock %}

{% block scripts %}
<script>
const initialItems = {{ items|tojson }};
const container = document.getElementById('itemsContainer');
let itemCount = 0;

function addItemCard(item) {
  item = item || {};
  const idx = itemCount++;
  const card = document.createElement('div');
  card.className = 'item-card';
  card.dataset.idx = idx;
  card.innerHTML = `
    <button type="button" class="remove-item" data-idx="${idx}">&times;</button>
    <div class="field">
      <label>Part Name</label>
      <input type="text" class="f-part-name" value="${escapeHtml(item.part_name || '')}" placeholder="e.g. Front brake pads">
    </div>
    <div class="field-row">
      <div class="field">
        <label>Part #</label>
        <input type="text" class="f-part-number" value="${escapeHtml(item.part_number || '')}">
      </div>
      <div class="field">
        <label>Cost ($)</label>
        <input type="number" step="0.01" class="f-cost" value="${item.cost != null ? item.cost : ''}">
      </div>
    </div>
    <div class="field">
      <label>Fits (vehicle) — you fill this in</label>
      <input type="text" class="f-fits" value="${escapeHtml(item.fits || '')}" placeholder="e.g. 2015-2018 Honda Civic">
    </div>
  `;
  container.appendChild(card);
  card.querySelector('.remove-item').addEventListener('click', () => card.remove());
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

if (initialItems.length) {
  initialItems.forEach(addItemCard);
} else {
  addItemCard({});
}

document.getElementById('addItemBtn').addEventListener('click', () => addItemCard({}));

document.getElementById('saveBtn').addEventListener('click', () => {
  const header = {
    supplier: document.getElementById('hdr_supplier').value,
    invoice_number: document.getElementById('hdr_invoice_number').value,
    invoice_date: document.getElementById('hdr_invoice_date').value,
    due_date: document.getElementById('hdr_due_date').value,
  };
  const items = Array.from(container.querySelectorAll('.item-card')).map(card => ({
    part_name: card.querySelector('.f-part-name').value,
    part_number: card.querySelector('.f-part-number').value,
    cost: card.querySelector('.f-cost').value,
    fits: card.querySelector('.f-fits').value,
  })).filter(i => i.part_name.trim());

  if (!header.supplier.trim()) { alert('Supplier is required.'); return; }
  if (!items.length) { alert('Add at least one part.'); return; }

  fetch('/confirm', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ header, items }),
  })
    .then(r => r.json())
    .then(data => {
      if (data.error) { alert(data.error); return; }
      window.location.href = '/invoices';
    });
});
</script>
{% endblock %}
